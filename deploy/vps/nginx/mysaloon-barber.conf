# partner.mysaloon.uz — statik SPA. Sertifikat admin bilan bitta (SAN).
server {
    listen 80;
    listen [::]:80;
    server_name partner.mysaloon.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name partner.mysaloon.uz;

    ssl_certificate /etc/letsencrypt/live/admin.mysaloon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mysaloon.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/mysaloon/Mybarber/apps/barber/dist/client;
    index index.html;
    client_max_body_size 20m;

    location = /barber/verify-email {
        return 302 /verify-email;
    }

    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
