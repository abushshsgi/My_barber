# partner.mysaloon.uz — statik SPA. API to'g'ridan-to'g'ri api.mysaloon.uz ga ketadi.
server {
    listen 80;
    listen [::]:80;
    server_name partner.mysaloon.uz;

    root /opt/mysaloon/Mybarber/apps/barber/dist/client;
    index index.html;
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /barber/verify-email {
        return 302 /verify-email;
    }

    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
