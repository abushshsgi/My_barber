# admin.mysaloon.uz — statik SPA. /api/v1 va /media same-origin bo'lib API ga ketadi.
server {
    listen 80;
    listen [::]:80;
    server_name admin.mysaloon.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.mysaloon.uz;

    ssl_certificate /etc/letsencrypt/live/admin.mysaloon.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.mysaloon.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/mysaloon/Mybarber/apps/admin/dist/client;
    index index.html;
    client_max_body_size 20m;

    location /api/v1/ {
        proxy_pass https://api.mysaloon.uz;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host api.mysaloon.uz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass https://api.mysaloon.uz;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mysaloon.uz;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
