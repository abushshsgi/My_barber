# Railway: Root Directory = backend bo‘lsa, bu fayl avtomatik o‘qiladi.
# Start: backend/Procfile → bin/start.sh (migrate + daphne ASGI)
# Redis: “New” → Redis → REDIS_URL env avtomatik; WebSocket + try-on navbat.
# Alohida worker servis: Procfile → worker: python manage.py run_tryon_worker
# Cron: “Cron Jobs” yoki alohida servis — remind_bookings, sync_exchange_rates:
#   schedule: 0 6 * * *
#   command:  python manage.py sync_exchange_rates --if-stale
# Production (mysaloon.uz) — Railway Variables:
#   DJANGO_DEBUG=false
#   DJANGO_ALLOWED_HOSTS=api.mysaloon.uz,.railway.app
#   API_PUBLIC_HOST=api.mysaloon.uz
#   FRONTEND_USER_ORIGIN=https://www.mysaloon.uz,https://mysaloon.uz
#   FRONTEND_ADMIN_ORIGIN=https://admin.mysaloon.uz
#   FRONTEND_BARBER_ORIGIN=https://partner.mysaloon.uz
#
# Media persistence (MUHIM — redeployda fayllar yo‘qolmasin):
#   Default (DEBUG=false, volume yo‘q): Postgres DatabaseMediaStorage
#   Yoki Railway → service → Add Volume → Mount path: /app/media
#   Yoki USE_S3_MEDIA=true + AWS_* (S3/R2)

[deploy]
releaseCommand = "bash bin/release.sh"
