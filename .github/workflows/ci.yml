name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py test ai accounts wallet chat notifications salons control_panel geo --verbosity=1

  frontend-user:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/user
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/user/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: https://api.mysaloon.uz
